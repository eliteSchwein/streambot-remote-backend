services:
  backend:
    build:
      context: .
      pull: true
      no_cache: true
    pull_policy: build
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      RUST_LOG: ${RUST_LOG:-streambot_remote_backend=debug,tower_http=debug,info}
      RUST_BACKTRACE: ${RUST_BACKTRACE:-1}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      - "8080:8080"

  mediamtx:
    image: bluenviron/mediamtx:1.21.3
    restart: unless-stopped
    environment:
      # MediaMTX overrides any mediamtx.yml key with MTX_<UPPERCASE KEY>.
      # Values are interpolated by docker compose from the project .env file.
      # Use a URL-safe MEDIAMTX_AUTH_SECRET (e.g. `openssl rand -hex 32`).
      MTX_AUTHHTTPADDRESS: http://backend:8080/internal/mediamtx/auth?secret=${MEDIAMTX_AUTH_SECRET:?MEDIAMTX_AUTH_SECRET must be set}
      # Comma separated public IPs/hostnames advertised as WebRTC ICE candidates.
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_WEBRTC_ADDITIONAL_HOSTS:?MEDIAMTX_WEBRTC_ADDITIONAL_HOSTS must be set}
      # Non-default ports (no clash with a local dev MediaMTX on 8890/8889/8189).
      # Container and host ports are identical: WebRTC advertises its own
      # listening port in ICE candidates, so it must match the published port.
      MTX_SRTADDRESS: :${MEDIAMTX_SRT_PORT:-18890}
      MTX_WEBRTCADDRESS: :${MEDIAMTX_WEBRTC_PORT:-18889}
      MTX_WEBRTCLOCALUDPADDRESS: :${MEDIAMTX_WEBRTC_UDP_PORT:-18189}
      MTX_RTSPADDRESS: :${MEDIAMTX_RTSP_PORT:-18554}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "${MEDIAMTX_SRT_PORT:-18890}:${MEDIAMTX_SRT_PORT:-18890}/udp" # SRT ingest
      - "${MEDIAMTX_WEBRTC_PORT:-18889}:${MEDIAMTX_WEBRTC_PORT:-18889}/tcp" # WebRTC HTTP (WHEP)
      - "${MEDIAMTX_WEBRTC_UDP_PORT:-18189}:${MEDIAMTX_WEBRTC_UDP_PORT:-18189}/udp" # WebRTC ICE
      - "${MEDIAMTX_RTSP_PORT:-18554}:${MEDIAMTX_RTSP_PORT:-18554}/tcp" # RTSP (read only)
      # 9997 (control API) is intentionally only reachable inside the compose network.

  postgres:
    image: postgres:18-trixie
    user: "0:0"
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_USER: streambot
      POSTGRES_PASSWORD: streambot
      POSTGRES_DB: streambot_remote
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streambot -d streambot_remote"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  valkey:
    image: valkey/valkey:9.1-trixie
    pull_policy: always
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres_data:
  valkey_data:
